<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Request Info</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div id="app-wrap">
        <div id="panels">
            <div class="panel error-panel">
                <div class="panel-label">REQUEST INFO</div>

                <p class="error-title">User-Agent: %% user-agent %%</p>
                <p class="error-title">Accept-Encoding: %% accept-encoding %%</p>
                <p class="error-title">Accept: %% accept %%</p>

                <button class="error-button" onclick="goHome()">RETURN TO BASE</button>
            </div>
        </div>
    </div>

    <script>
        function goHome() {
            window.location.href = '/';
        }
    </script>

</body>

</html>
