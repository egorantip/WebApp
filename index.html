<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>3D Editor Interface</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            height: 100vh;
        }

        /* Панель инструментов слева */
        #sidebar {
            width: 250px;
            background: #f0f0f0;
            padding: 10px;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        /* Область с 4 вьюпортами */
        #viewports {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            background: #333;
        }

        .viewport {
            position: relative;
            background: #1a1a1a;
            overflow: hidden;
        }

        .viewport canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .label {
            position: absolute;
            top: 5px;
            left: 5px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 6px;
            font-size: 12px;
            pointer-events: none;
            user-select: none;
        }

        /* Стили элементов управления */
        .control-group {
            background: white;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .control-group h3 {
            margin-top: 0;
            font-size: 14px;
            margin-bottom: 10px;
        }

        select,
        input[type="color"] {
            width: 100%;
            padding: 5px;
            margin-bottom: 5px;
        }

        .info {
            font-size: 12px;
            color: #555;
            line-height: 1.4;
        }

        .key-badge {
            display: inline-block;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 1px 4px;
            font-family: monospace;
            font-size: 11px;
        }
    </style>

    <!-- Карта импортов -->
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "three/addons/": "./"
            }
        }
    </script>
</head>

<body>

    <!-- Панель управления -->
    <div id="sidebar">
        <h2>3D Editor</h2>

        <div class="control-group">
            <h3>Объект</h3>
            <label for="objectSelect">Выбрать:</label>
            <select id="objectSelect">
                <!-- Опции добавятся через JS -->
            </select>
        </div>

        <div class="control-group">
            <h3>Цвет материала</h3>
            <input type="color" id="colorPicker" value="#ff0000">
        </div>

        <div class="control-group">
            <h3>Управление</h3>
            <div class="info">
                <p><span class="key-badge">↑</span> <span class="key-badge">↓</span> <span class="key-badge">←</span>
                    <span class="key-badge">→</span> : Перемещение (X/Z)
                </p>
                <p><span class="key-badge">+</span> <span class="key-badge">-</span> : Высота (Y)</p>
                <p><i>ЛКМ + Драг</i> в правом нижнем окне: Вращение камеры</p>
            </div>
        </div>
    </div>

    <!-- 4 Окна просмотра -->
    <div id="viewports">
        <div class="viewport" id="view-top">
            <div class="label">Top (Orthographic)</div>
        </div>
        <div class="viewport" id="view-front">
            <div class="label">Front (Orthographic)</div>
        </div>
        <div class="viewport" id="view-right">
            <div class="label">Right (Orthographic)</div>
        </div>
        <div class="viewport" id="view-persp">
            <div class="label">Perspective</div>
        </div>
    </div>

    <!-- Основной скрипт как модуль -->
    <script type="module" src="main.js"></script>
</body>

</html>
