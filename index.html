<!DOCTYPE html>
<html>

<head>
    <h1>Paint</h1>
    <style>
        canvas {
            border: 1px solid black;
            cursor: crosshair;
        }

        .tools {
            margin: 15px 10px 0 0;
        }

        .tools label {
            margin-right: 15px;
            margin-left: 10px;
        }

        .colors {
            display: flex;
            gap: 10px;
        }

        .color {
            width: 30px;
            height: 30px;
            border: 2px solid #cccccc28;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
        }

        .color.active {
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px #000, inset 0 2px 4px rgba(0, 0, 0, 0.2);
            transform: scale(1.1);
        }

        .color:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .tools button {
            margin-right: 20px;
            margin-bottom: 10px;
            padding: 8px 16px;
            cursor: pointer;
            border: 2px solid #ddd;
            border-radius: 6px;
            background-color: #f8f9fa;
            color: #333;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tools button:hover {
            background-color: #e9ecef;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .tools button.active {
            background-color: #007bff;
            color: white;
            border-color: #0056b3;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="tools">
        <button id="pencil">Карандаш</button>
        <button id="eraser">Ластик</button>
        <button id="clear">Очистить</button>
        <label>Цвет: <div class="colors" id="palette"></div></label>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script src="paint.js"></script>
</body>

</html>
